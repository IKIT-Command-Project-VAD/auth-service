name: ShoppingList-keycloak-dev

services:
  keycloak-db:
    image: postgres:16
    container_name: sl-keycloak-db
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.4
    container_name: sl-keycloak
    command: >
      start-dev
      --http-port=${KC_HTTP_PORT}
    restart: unless-stopped
    depends_on:
      keycloak-db:
        condition: service_healthy
  
  mailpit:
    image: axllent/mailpit:latest
    container_name: sl-mailpit
    restart: unless-stopped